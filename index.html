<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#092b40">
  <title>斌车 · 蓝牙遥控</title>
  <link rel="stylesheet" href="style.css?v=20261106-3">
</head>
<body>
  <main>
    <header>
      <div><span class="eyebrow">BLE CONTROLLER</span><h1>斌车遥控</h1></div>
      <button id="connect" class="connect">连接蓝牙</button>
    </header>
    <div class="status"><span id="dot" class="dot"></span><span id="status">未连接</span></div>
    <section class="controller">
      <div class="pad-area">
        <div class="caption">方向摇杆 <span>松开停车</span></div>
        <div id="pad" class="pad" aria-label="方向摇杆">
          <span class="arrow up">▲</span><span class="arrow down">▼</span>
          <span class="arrow left">◀</span><span class="arrow right">▶</span>
          <div id="knob" class="knob"></div>
        </div>
        <div id="direction" class="hint">等待操作</div>
      </div>
      <div class="dashboard" aria-label="小车状态">
        <div class="caption">车辆状态 <span>等待小车回传</span></div>
        <div class="metric speed"><small>速度 / SPEED</small><strong>--</strong><span>暂无数据</span></div>
        <div class="environment">
          <div class="metric"><small>温度</small><strong>-- <em>°C</em></strong></div>
          <div class="metric"><small>湿度</small><strong>-- <em>%</em></strong></div>
        </div>
      </div>
      <div class="buttons-area">
        <div class="caption">行驶模式 <span>功能待接入</span></div>
        <div class="buttons">
          <button disabled><strong>02</strong><small>四方向斜行</small></button>
          <button disabled><strong>03</strong><small>超声波</small></button>
          <button disabled><strong>04</strong><small>循迹</small></button>
          <button disabled><strong>05</strong><small>平移与原地旋转</small></button>
        </div>
        <div class="speed-controls"><button data-key="1">− 减速</button><button data-key="0">＋ 加速</button></div>
        <button id="stop" class="stop">立即停车</button>
      </div>
    </section>
    <p class="foot">速度与温湿度等待小车回传；模式 2–5 待接入。</p>
    <p id="notice" class="notice" role="status"></p>
  </main>
  <script src="app.js?v=20261106-2"></script>
</body>
</html>
